<div class="account-update-container">
  <div class="account-update-card">
    <h1>Account Update</h1>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="form-group">
        <label for="accountId">Account ID:</label>
        <input 
          type="text" 
          id="accountId" 
          formControlName="accountId"
          maxlength="11"
          placeholder="Enter 11-digit Account ID"
          [class.error]="searchForm.get('accountId')?.touched && searchForm.get('accountId')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isLoading">Search</button>
        <button type="button" (click)="onClear()">Clear</button>
        <button type="button" (click)="goBack()">Back</button>
      </div>
    </form>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onUpdate()" *ngIf="account">
      <h2>Account Information</h2>
      
      <div class="readonly-info">
        <div class="info-item">
          <span class="label">Account ID:</span>
          <span class="value">{{ account.accountId }}</span>
        </div>
        <div class="info-item">
          <span class="label">Current Balance:</span>
          <span class="value">{{ account.currentBalance | currency }}</span>
        </div>
      </div>

      <div class="form-group">
        <label for="accountStatus">Account Status:</label>
        <select id="accountStatus" formControlName="accountStatus" class="form-control">
          <option value="A">Active</option>
          <option value="C">Closed</option>
          <option value="S">Suspended</option>
        </select>
      </div>

      <div class="form-group">
        <label for="creditLimit">Credit Limit:</label>
        <input 
          type="text" 
          id="creditLimit" 
          formControlName="creditLimit"
          [class.error]="updateForm.get('creditLimit')?.touched && updateForm.get('creditLimit')?.invalid"
        />
        <div class="error-message" *ngIf="updateForm.get('creditLimit')?.touched && updateForm.get('creditLimit')?.hasError('numeric')">
          Credit limit must be numeric
        </div>
      </div>

      <div class="form-group">
        <label for="expirationDate">Expiration Date (YYYY-MM-DD):</label>
        <input 
          type="text" 
          id="expirationDate" 
          formControlName="expirationDate"
          placeholder="YYYY-MM-DD"
          [class.error]="updateForm.get('expirationDate')?.touched && updateForm.get('expirationDate')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="reissueDate">Reissue Date (YYYY-MM-DD):</label>
        <input 
          type="text" 
          id="reissueDate" 
          formControlName="reissueDate"
          placeholder="YYYY-MM-DD"
          [class.error]="updateForm.get('reissueDate')?.touched && updateForm.get('reissueDate')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isUpdating || updateForm.invalid">
          {{ isUpdating ? 'Updating...' : 'Update Account' }}
        </button>
      </div>
    </form>
  </div>
</div>
