<div class="user-list-container">
  <div class="user-list-card">
    <h1>User Management</h1>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="button-group header-buttons">
      <button (click)="onAdd()">Add New User</button>
      <button (click)="goBack()">Back to Admin Menu</button>
    </div>

    <div class="loading" *ngIf="isLoading">
      Loading users...
    </div>

    <div class="users-section" *ngIf="!isLoading && users.length > 0">
      <h2>Users ({{ users.length }})</h2>
      <div class="users-table">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>User Type</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users" class="user-row">
              <td>{{ user.userId }}</td>
              <td>{{ user.firstName }}</td>
              <td>{{ user.lastName }}</td>
              <td>
                <span class="user-type" [ngClass]="user.userType === 'A' ? 'type-admin' : 'type-regular'">
                  {{ user.userType === 'A' ? 'Admin' : 'Regular' }}
                </span>
              </td>
              <td>
                <div class="action-buttons">
                  <button class="update-btn" (click)="onUpdate(user)">Update</button>
                  <button class="delete-btn" (click)="onDelete(user)">Delete</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div *ngIf="!isLoading && users.length === 0" class="no-data">
      No users found.
    </div>
  </div>
</div>
