<div class="user-update-container">
  <div class="user-update-card">
    <h1>Update User</h1>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="form-group">
        <label for="userId">User ID:</label>
        <input 
          type="text" 
          id="userId" 
          formControlName="userId"
          placeholder="Enter User ID"
          [class.error]="searchForm.get('userId')?.touched && searchForm.get('userId')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isLoading">Search</button>
        <button type="button" (click)="onClear()">Clear</button>
        <button type="button" (click)="goBack()">Back</button>
      </div>
    </form>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onUpdate()" *ngIf="user">
      <h2>User Information</h2>
      
      <div class="readonly-info">
        <div class="info-item">
          <span class="label">User ID:</span>
          <span class="value">{{ user.userId }}</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name: *</label>
          <input 
            type="text" 
            id="firstName" 
            formControlName="firstName"
            placeholder="First Name"
            [class.error]="updateForm.get('firstName')?.touched && updateForm.get('firstName')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name: *</label>
          <input 
            type="text" 
            id="lastName" 
            formControlName="lastName"
            placeholder="Last Name"
            [class.error]="updateForm.get('lastName')?.touched && updateForm.get('lastName')?.invalid"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">New Password (leave blank to keep current):</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="New Password (optional)"
        />
      </div>

      <div class="form-group">
        <label for="userType">User Type: *</label>
        <select id="userType" formControlName="userType" class="form-control">
          <option value="R">Regular User</option>
          <option value="A">Admin User</option>
        </select>
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isUpdating || updateForm.invalid">
          {{ isUpdating ? 'Updating...' : 'Update User' }}
        </button>
      </div>
    </form>
  </div>
</div>
