<div class="transaction-type-update-container">
  <div class="transaction-type-update-card">
    <h1>Update Transaction Type</h1>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="readonly-info">
      <div class="info-item">
        <span class="label">Type Code:</span>
        <span class="value">{{ typeCode }}</span>
      </div>
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onUpdate()">
      <div class="form-group">
        <label for="description">Description: *</label>
        <input 
          type="text" 
          id="description" 
          formControlName="description"
          placeholder="Enter Description"
          [class.error]="updateForm.get('description')?.touched && updateForm.get('description')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isUpdating || updateForm.invalid">
          {{ isUpdating ? 'Updating...' : 'Update' }}
        </button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
