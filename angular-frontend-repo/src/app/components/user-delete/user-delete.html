<div class="user-delete-container">
  <div class="user-delete-card">
    <h1>Delete User</h1>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="form-group">
        <label for="userId">User ID:</label>
        <input 
          type="text" 
          id="userId" 
          formControlName="userId"
          placeholder="Enter User ID"
          [class.error]="searchForm.get('userId')?.touched && searchForm.get('userId')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isLoading">Search</button>
        <button type="button" (click)="onClear()">Clear</button>
        <button type="button" (click)="goBack()">Back</button>
      </div>
    </form>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div *ngIf="user && !successMessage" class="user-details">
      <h2>User Information</h2>
      
      <div class="warning-banner">
        <strong>Warning:</strong> This action cannot be undone!
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <span class="label">User ID:</span>
          <span class="value">{{ user.userId }}</span>
        </div>
        <div class="detail-item">
          <span class="label">First Name:</span>
          <span class="value">{{ user.firstName }}</span>
        </div>
        <div class="detail-item">
          <span class="label">Last Name:</span>
          <span class="value">{{ user.lastName }}</span>
        </div>
        <div class="detail-item">
          <span class="label">User Type:</span>
          <span class="value">{{ user.userType === 'A' ? 'Admin' : 'Regular' }}</span>
        </div>
      </div>

      <div class="button-group">
        <button class="delete-btn" (click)="onDelete()" [disabled]="isDeleting">
          {{ isDeleting ? 'Deleting...' : 'Confirm Delete' }}
        </button>
        <button type="button" (click)="goBack()">Cancel</button>
      </div>
    </div>
  </div>
</div>
