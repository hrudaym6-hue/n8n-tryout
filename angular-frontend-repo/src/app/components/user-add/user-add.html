<div class="user-add-container">
  <div class="user-add-card">
    <h1>Add New User</h1>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="userId">User ID: *</label>
        <input 
          type="text" 
          id="userId" 
          formControlName="userId"
          placeholder="Enter User ID"
          [class.error]="userForm.get('userId')?.touched && userForm.get('userId')?.invalid"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name: *</label>
          <input 
            type="text" 
            id="firstName" 
            formControlName="firstName"
            placeholder="First Name"
            [class.error]="userForm.get('firstName')?.touched && userForm.get('firstName')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name: *</label>
          <input 
            type="text" 
            id="lastName" 
            formControlName="lastName"
            placeholder="Last Name"
            [class.error]="userForm.get('lastName')?.touched && userForm.get('lastName')?.invalid"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password: *</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="Enter Password"
          [class.error]="userForm.get('password')?.touched && userForm.get('password')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="userType">User Type: *</label>
        <select id="userType" formControlName="userType" class="form-control">
          <option value="R">Regular User</option>
          <option value="A">Admin User</option>
        </select>
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isSubmitting || userForm.invalid">
          {{ isSubmitting ? 'Creating...' : 'Create User' }}
        </button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
