<div class="transaction-add-container">
  <div class="transaction-add-card">
    <h1>Add Transaction</h1>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="cardNumber">Card Number: *</label>
          <input 
            type="text" 
            id="cardNumber" 
            formControlName="cardNumber"
            maxlength="16"
            placeholder="16-digit Card Number"
            [class.error]="transactionForm.get('cardNumber')?.touched && transactionForm.get('cardNumber')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="transactionAmount">Amount: *</label>
          <input 
            type="text" 
            id="transactionAmount" 
            formControlName="transactionAmount"
            placeholder="Transaction Amount"
            [class.error]="transactionForm.get('transactionAmount')?.touched && transactionForm.get('transactionAmount')?.invalid"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="transactionTypeCode">Type Code: *</label>
          <input 
            type="text" 
            id="transactionTypeCode" 
            formControlName="transactionTypeCode"
            maxlength="2"
            placeholder="Type Code"
            [class.error]="transactionForm.get('transactionTypeCode')?.touched && transactionForm.get('transactionTypeCode')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="transactionCategoryCode">Category Code: *</label>
          <input 
            type="text" 
            id="transactionCategoryCode" 
            formControlName="transactionCategoryCode"
            maxlength="4"
            placeholder="Category Code"
            [class.error]="transactionForm.get('transactionCategoryCode')?.touched && transactionForm.get('transactionCategoryCode')?.invalid"
          />
        </div>

        <div class="form-group">
          <label for="transactionSource">Transaction Source: *</label>
          <input 
            type="text" 
            id="transactionSource" 
            formControlName="transactionSource"
            maxlength="10"
            placeholder="Transaction Source"
            [class.error]="transactionForm.get('transactionSource')?.touched && transactionForm.get('transactionSource')?.invalid"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="transactionDescription">Description: *</label>
        <textarea 
          id="transactionDescription" 
          formControlName="transactionDescription"
          rows="3"
          placeholder="Transaction Description"
          [class.error]="transactionForm.get('transactionDescription')?.touched && transactionForm.get('transactionDescription')?.invalid"
        ></textarea>
      </div>

      <h3>Merchant Information (Optional)</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="merchantId">Merchant ID:</label>
          <input 
            type="text" 
            id="merchantId" 
            formControlName="merchantId"
            placeholder="Merchant ID"
          />
        </div>

        <div class="form-group">
          <label for="merchantName">Merchant Name:</label>
          <input 
            type="text" 
            id="merchantName" 
            formControlName="merchantName"
            placeholder="Merchant Name"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="merchantCity">Merchant City:</label>
          <input 
            type="text" 
            id="merchantCity" 
            formControlName="merchantCity"
            placeholder="City"
          />
        </div>

        <div class="form-group">
          <label for="merchantZip">Merchant ZIP:</label>
          <input 
            type="text" 
            id="merchantZip" 
            formControlName="merchantZip"
            maxlength="10"
            placeholder="ZIP Code"
          />
        </div>
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isSubmitting || transactionForm.invalid">
          {{ isSubmitting ? 'Adding...' : 'Add Transaction' }}
        </button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
