<div class="bill-payment-container">
  <div class="bill-payment-card">
    <h1>Bill Payment</h1>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="accountId">Account ID: *</label>
        <input 
          type="text" 
          id="accountId" 
          formControlName="accountId"
          maxlength="11"
          placeholder="Enter 11-digit Account ID"
          [class.error]="paymentForm.get('accountId')?.touched && paymentForm.get('accountId')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="paymentAmount">Payment Amount: *</label>
        <input 
          type="text" 
          id="paymentAmount" 
          formControlName="paymentAmount"
          placeholder="Enter Payment Amount"
          [class.error]="paymentForm.get('paymentAmount')?.touched && paymentForm.get('paymentAmount')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="paymentDate">Payment Date (YYYY-MM-DD): *</label>
        <input 
          type="text" 
          id="paymentDate" 
          formControlName="paymentDate"
          placeholder="YYYY-MM-DD"
          [class.error]="paymentForm.get('paymentDate')?.touched && paymentForm.get('paymentDate')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="confirmationNumber">Confirmation Number:</label>
        <input 
          type="text" 
          id="confirmationNumber" 
          formControlName="confirmationNumber"
          placeholder="Confirmation Number (Optional)"
          [class.error]="paymentForm.get('confirmationNumber')?.touched && paymentForm.get('confirmationNumber')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isSubmitting || paymentForm.invalid">
          {{ isSubmitting ? 'Processing...' : 'Process Payment' }}
        </button>
        <button type="button" (click)="onClear()">Clear</button>
        <button type="button" (click)="goBack()">Back to Menu</button>
      </div>
    </form>
  </div>
</div>
