<div class="card-update-container">
  <div class="card-update-card">
    <h1>Card Update</h1>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="form-group">
        <label for="cardNumber">Card Number:</label>
        <input 
          type="text" 
          id="cardNumber" 
          formControlName="cardNumber"
          maxlength="16"
          placeholder="Enter 16-digit Card Number"
          [class.error]="searchForm.get('cardNumber')?.touched && searchForm.get('cardNumber')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isLoading">Search</button>
        <button type="button" (click)="onClear()">Clear</button>
        <button type="button" (click)="goBack()">Back</button>
      </div>
    </form>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onUpdate()" *ngIf="card">
      <h2>Card Information</h2>
      
      <div class="readonly-info">
        <div class="info-item">
          <span class="label">Card Number:</span>
          <span class="value">{{ card.cardNumber }}</span>
        </div>
        <div class="info-item">
          <span class="label">Account ID:</span>
          <span class="value">{{ card.accountId }}</span>
        </div>
        <div class="info-item">
          <span class="label">Card Type:</span>
          <span class="value">{{ card.cardType }}</span>
        </div>
      </div>

      <div class="form-group">
        <label for="cardStatus">Card Status:</label>
        <select id="cardStatus" formControlName="cardStatus" class="form-control">
          <option value="A">Active</option>
          <option value="C">Closed</option>
          <option value="S">Stolen</option>
          <option value="L">Lost</option>
        </select>
      </div>

      <div class="form-group">
        <label for="expirationDate">Expiration Date (YYYY-MM-DD):</label>
        <input 
          type="text" 
          id="expirationDate" 
          formControlName="expirationDate"
          placeholder="YYYY-MM-DD"
          [class.error]="updateForm.get('expirationDate')?.touched && updateForm.get('expirationDate')?.invalid"
        />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isUpdating || updateForm.invalid">
          {{ isUpdating ? 'Updating...' : 'Update Card' }}
        </button>
      </div>
    </form>
  </div>
</div>
