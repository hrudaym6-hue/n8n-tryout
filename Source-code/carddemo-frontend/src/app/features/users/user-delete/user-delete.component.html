<div class="container">
  <div class="header">
    <h2>Delete User</h2>
    <button class="btn-back" (click)="cancel()">Cancel</button>
  </div>

  <div *ngIf="isLoading && !user" class="loading">Loading user...</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && user" class="delete-confirmation">
    <div class="warning-icon">⚠️</div>
    <h3>Are you sure you want to delete this user?</h3>
    <div class="user-info">
      <p><strong>User ID:</strong> {{ user.userId }}</p>
      <p><strong>Name:</strong> {{ user.firstName }} {{ user.lastName }}</p>
      <p><strong>User Type:</strong> {{ user.userType === 'A' ? 'Admin' : 'Regular' }}</p>
    </div>
    <p class="warning-text">This action cannot be undone.</p>

    <div class="form-actions">
      <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmDelete()" [disabled]="isLoading">
        {{ isLoading ? 'Deleting...' : 'Delete User' }}
      </button>
    </div>
  </div>
</div>
