<div class="container">
  <div class="header">
    <h2>User Management</h2>
    <div class="header-actions">
      <button class="btn-add" (click)="addUser()">Add User</button>
      <button class="btn-back" (click)="goBack()">Back to Menu</button>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Loading users...</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && !errorMessage" class="user-table">
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>User Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of paginatedUsers">
          <td>{{ user.userId }}</td>
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.userType === 'A' ? 'Admin' : 'Regular' }}</td>
          <td>
            <button class="btn-update" (click)="updateUser(user.userId)">Update</button>
            <button class="btn-delete" (click)="deleteUser(user.userId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button [disabled]="currentPage === 0" (click)="previousPage()">Previous</button>
      <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
      <button [disabled]="currentPage >= totalPages - 1" (click)="nextPage()">Next</button>
    </div>
  </div>
</div>
