<div class="container">
  <div class="header">
    <h2>Update Account</h2>
    <button class="btn-back" (click)="goBack()">Cancel</button>
  </div>

  <div *ngIf="isLoading && !account" class="loading">Loading account...</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

  <div *ngIf="!isLoading && account" class="update-form">
    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="accountId">Account ID:</label>
        <input type="text" id="accountId" formControlName="accountId" class="form-control" readonly />
      </div>

      <div class="form-group">
        <label for="address">Address:</label>
        <input
          type="text"
          id="address"
          formControlName="address"
          class="form-control"
          [class.is-invalid]="updateForm.get('address')?.invalid && updateForm.get('address')?.touched"
        />
        <div class="invalid-feedback" *ngIf="updateForm.get('address')?.invalid && updateForm.get('address')?.touched">
          Address must be alphanumeric
        </div>
      </div>

      <div class="form-group">
        <label for="city">City:</label>
        <input
          type="text"
          id="city"
          formControlName="city"
          class="form-control"
          [class.is-invalid]="updateForm.get('city')?.invalid && updateForm.get('city')?.touched"
        />
        <div class="invalid-feedback" *ngIf="updateForm.get('city')?.invalid && updateForm.get('city')?.touched">
          City must be alpha only
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="state">State:</label>
          <input
            type="text"
            id="state"
            formControlName="state"
            class="form-control"
            maxlength="2"
            [class.is-invalid]="updateForm.get('state')?.invalid && updateForm.get('state')?.touched"
          />
          <div class="invalid-feedback" *ngIf="updateForm.get('state')?.invalid && updateForm.get('state')?.touched">
            State must be 2 characters
          </div>
        </div>

        <div class="form-group">
          <label for="zip">ZIP:</label>
          <input
            type="text"
            id="zip"
            formControlName="zip"
            class="form-control"
            [class.is-invalid]="updateForm.get('zip')?.invalid && updateForm.get('zip')?.touched"
          />
          <div class="invalid-feedback" *ngIf="updateForm.get('zip')?.invalid && updateForm.get('zip')?.touched">
            ZIP must be 5 or 9 digits
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone:</label>
          <input
            type="text"
            id="phone"
            formControlName="phone"
            class="form-control"
            placeholder="123-456-7890"
            [class.is-invalid]="updateForm.get('phone')?.invalid && updateForm.get('phone')?.touched"
          />
          <div class="invalid-feedback" *ngIf="updateForm.get('phone')?.invalid && updateForm.get('phone')?.touched">
            Phone must be in format: 123-456-7890
          </div>
        </div>

        <div class="form-group">
          <label for="creditLimit">Credit Limit:</label>
          <input
            type="text"
            id="creditLimit"
            formControlName="creditLimit"
            class="form-control"
            [class.is-invalid]="updateForm.get('creditLimit')?.invalid && updateForm.get('creditLimit')?.touched"
          />
          <div class="invalid-feedback" *ngIf="updateForm.get('creditLimit')?.invalid && updateForm.get('creditLimit')?.touched">
            Credit limit must be numeric
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="clearForm()">Clear</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Updating...' : 'Update Account' }}
        </button>
      </div>
    </form>
  </div>
</div>
